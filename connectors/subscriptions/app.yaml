# Commerce's connector with Finance: subscriptions sold in the store. Finance bills them; the store
# sells the first period, asks for each renewal through its payment methods and shows customers their
# own. Offered where both are installed.
id: commerce-subscriptions
name: Store Subscriptions
version: 0.1.0
publisher: cbferrum
summary: Sell subscription plans in the online store, with renewals paid online and customers managing their own
categories: [commerce, finance]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-commerce
support: https://github.com/CBFerrum/ferrum-app-commerce/issues
runtime: native
platform: ">=0.3.1, <0.4"
requires: {commerce: ">=0.6", finance: ">=0.3"}
packages: [commerce_subscriptions]
uninstall: ask
