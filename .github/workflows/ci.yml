name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      FERRUM_COMMERCE_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The application role must not be a superuser: superusers bypass row-level security.
      - name: Create the application role and test database
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role ferrum login password 'ferrum';
          create database ferrum_commerce_test owner ferrum;
          SQL
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  gateways:
    runs-on: ubuntu-latest
    # Stripe's own mock, built from its API definition: it refuses what Stripe would refuse.
    services:
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports: ["12111:12111"]
    defaults:
      run:
        working-directory: gateways
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateways
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # PayPal's own API definitions (paypal/paypal-rest-api-specifications), served by a mock that
      # refuses every request they do not allow.
      - name: Serve PayPal's API definitions
        run: |
          mkdir -p "$RUNNER_TEMP/paypal"
          for spec in checkout_orders_v2 notifications_webhooks_v1; do
            curl -fsSL "https://raw.githubusercontent.com/paypal/paypal-rest-api-specifications/90e8041ffe02/openapi/$spec.json" -o "$RUNNER_TEMP/paypal/$spec.json"
          done
          docker run -d --name prism-orders -p 4010:4010 -v "$RUNNER_TEMP/paypal:/specs:ro" stoplight/prism:5.15.10 \
            mock -h 0.0.0.0 -p 4010 --multiprocess false --errors /specs/checkout_orders_v2.json
          docker run -d --name prism-webhooks -p 4011:4011 -v "$RUNNER_TEMP/paypal:/specs:ro" stoplight/prism:5.15.10 \
            mock -h 0.0.0.0 -p 4011 --multiprocess false --errors /specs/notifications_webhooks_v1.json
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:4010/ && curl -s -o /dev/null http://localhost:4011/ && break; sleep 1; done
      # The sandbox tests call the providers' test modes when these secrets are set and skip otherwise.
      - run: cargo test
        env:
          STRIPE_MOCK_URL: http://localhost:12111
          PAYPAL_ORDERS_MOCK: http://localhost:4010
          PAYPAL_WEBHOOKS_MOCK: http://localhost:4011
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
      - run: cargo build --release --target wasm32-unknown-unknown
