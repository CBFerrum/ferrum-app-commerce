package: commerce
version: 0.3.0
label: Commerce
description: Online store on the same items, prices, stock and books - catalog with categories and reviews, carts, guest and customer checkout into sales orders, payment requests for gateway plugins, shipping rules and coupon codes.
depends: [core, selling, inventory, accounting]
field_prefix: commerce_

overlays:
  - entity: Customer
    ops:
      - {op: add_field, field: {name: commerce_guest, type: check, label: Web Guest, read_only: true, in_filter: true, description: "Created by a guest checkout with an unverified email address: never linked to a portal account"}}
  - entity: SalesOrder
    ops:
      - {op: add_field, after: po_no, field: {name: commerce_web_order, type: check, label: Web Order, read_only: true, in_filter: true}}
      - {op: add_field, after: commerce_web_order, field: {name: commerce_payment_status, type: select, label: Web Payment, read_only: true, in_filter: true,
          options: [Pending, Paid, Failed, Expired, Cancelled, Not Required, Partly Refunded, Refunded]}}
      - {op: add_field, after: commerce_payment_status, field: {name: commerce_fulfilment_status, type: select, label: Fulfilment, read_only: true, in_filter: true,
          options: [Unfulfilled, Partly Fulfilled, Fulfilled], description: "Follows the order's deliveries: shipped in parts, or all of it"}}
      - {op: add_field, after: commerce_payment_status, field: {name: commerce_payment_method, type: data, label: Web Payment Method, read_only: true, max_length: 40, in_filter: true}}
      - {op: add_field, field: {name: commerce_contact_email, type: email, label: Contact Email, read_only: true}}
      - {op: add_field, field: {name: commerce_contact_phone, type: phone, label: Contact Phone, read_only: true}}
      - {op: add_field, field: {name: commerce_shipping_address, type: text, label: Ship To, read_only: true}}
      - {op: add_field, field: {name: commerce_billing_address, type: text, label: Bill To, read_only: true}}
      - {op: add_field, field: {name: commerce_shipping_rule, type: link, to: ShippingRule, label: Shipping Method, read_only: true}}
      - {op: add_field, field: {name: commerce_coupon, type: link, to: CouponCode, label: Coupon, read_only: true}}
      - {op: add_field, field: {name: commerce_notes, type: text, label: Customer Notes, read_only: true}}
      - {op: add_field, field: {name: commerce_paid_by_card, type: currency, label: Paid by Gift Card, read_only: true, description: "Taken from a gift card at checkout: the order was invoiced then, as stored value pays invoices"}}
      - {op: add_field, field: {name: commerce_cards_sent, type: check, label: Gift Cards Sent, read_only: true, description: "The codes of the gift cards this order bought went to the shopper, once"}}
      # The store's people ship and invoice web orders from the desk without holding the Sales roles:
      # these actions do exactly that, for web orders only (src/ship.rs checks who may).
      - {op: add_action, action: {name: web_ship, label: Ship Web Order, docstatus: [1], permission: read, condition: "doc.commerce_web_order && doc.per_delivered < 100.0 && doc.status != 'Closed'",
          confirm: "Ship this order, or the lines chosen? Stock leaves the warehouses.",
          params: [{name: lines, label: "Lines (empty: everything left)", type: text, description: "A JSON list of {line, qty, warehouse}: the order line's id, how many (empty: all left), and a store warehouse to ship it from (empty: the one the order reserved it in)"},
                   {name: carrier, label: Carrier, type: data}, {name: tracking_number, label: Tracking number, type: data}, {name: tracking_url, label: Tracking link, type: data},
                   {name: notify, label: Tell the customer, type: select, options: ["Yes", "No"]}, {name: invoice, label: "Invoice it when this shipment completes the order", type: select, options: ["Yes", "No"]}]}}
      - {op: add_action, action: {name: web_invoice, label: Invoice Web Order, docstatus: [1], permission: read, condition: "doc.commerce_web_order && doc.per_billed < 100.0 && doc.per_delivered >= 100.0 && doc.status != 'Closed'",
          confirm: "Create the invoice for this delivered order?"}}
      - {op: add_action, action: {name: web_tracking_link, label: Tracking Link, docstatus: [1, 2], permission: read, condition: "doc.commerce_web_order"}}
  - entity: DeliveryNote
    ops:
      - {op: add_field, field: {name: commerce_tracking_number, type: data, label: Tracking Number, max_length: 120, description: "Shown to the shopper on the order page"}}
      - {op: add_field, field: {name: commerce_tracking_url, type: url, label: Tracking Link, max_length: 2000}}
      - {op: add_field, field: {name: commerce_notify, type: check, label: Tell the Customer, description: "Sends the shopper the shipping news (the commerce.order_shipped event) when this is submitted"}}
  - entity: PaymentEntry
    ops:
      - {op: add_field, field: {name: commerce_sales_order, type: link, to: SalesOrder, label: Web Order, read_only: true, in_filter: true}}
      - {op: add_field, field: {name: commerce_payment_request, type: link, to: PaymentRequest, label: Payment Request, read_only: true}}

modules:
  - name: commerce
    label: Commerce
    icon: shopping-bag
    order: 42
    items: [StoreSettings, WebsiteItem, ItemCategory, ItemReview, ShoppingCart, PaymentRequest, PaymentException, OrderRefund, ReturnReason, ShippingRule, CouponCode, SalesOrder,
            report:web_sales, report:top_products, report:abandoned_carts, report:conversion_funnel, report:coupon_usage]

# What a personal-data request exports and erases for a shopper (their email): their carts'
# contact and address details, and their name on reviews (the review itself stays, unsigned).
personal_data:
  - {entity: ShoppingCart, match: email, phone: phone, erase: [email, user_email, phone, contact_name, ship_address_line1, ship_address_line2, ship_city, ship_state, ship_postal_code, bill_address_line1, bill_address_line2, bill_city, bill_state, bill_postal_code, notes]}
  - {entity: ItemReview, match: reviewer_email, erase: [reviewer_name, reviewer_email]}
  - {entity: PaymentRequest, match: payer_email, retain: "Payment records"}
roles:
  - name: Website Manager
    description: Runs the online store - settings, catalog, categories, review moderation, shipping, coupons and payment requests.
    permissions:
      - {entity: StoreSettings, read: true, write: true, create: true}
      - {entity: WebsiteItem, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: ItemCategory, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: ItemReview, read: true, write: true, create: true, delete: true, export: true}
      - {entity: ShippingRule, read: true, write: true, create: true, delete: true}
      - {entity: CouponCode, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: PricingRule, read: true, write: true, create: true}
      - {entity: Promotion, read: true, write: true, create: true}
      - {entity: PromotionCode, read: true, write: true, create: true, export: true, import: true}
      - {entity: ShoppingCart, read: true, export: true}
      - {entity: PaymentRequest, read: true, write: true, cancel: true, export: true}
      - {entity: PaymentException, read: true, write: true, export: true}
      - {entity: OrderRefund, read: true, write: true, create: true, export: true}
      - {entity: ReturnReason, read: true, write: true, create: true, delete: true}
      - {entity: SalesOrder, read: true, export: true}
      - {entity: DeliveryNote, read: true}
      - {entity: SalesInvoice, read: true}
      - {entity: Customer, read: true}
      - {entity: CustomerGroup, read: true}
      - {entity: Item, read: true}
      - {entity: ItemGroup, read: true}
      - {entity: ItemPrice, read: true}
      - {entity: PriceList, read: true}
      - {entity: Warehouse, read: true}
      - {entity: Company, read: true}
      - {entity: Currency, read: true}
      - {entity: Uom, read: true}
      - {entity: TaxTemplate, read: true}
      - {entity: Account, read: true}
  - name: Sales User
    permissions:
      - {entity: ShoppingCart, read: true}
      - {entity: PaymentRequest, read: true}
      - {entity: PaymentException, read: true}
      - {entity: OrderRefund, read: true, create: true}
      - {entity: ReturnReason, read: true}
      - {entity: WebsiteItem, read: true}
      - {entity: ItemCategory, read: true}
      - {entity: ShippingRule, read: true}
      - {entity: CouponCode, read: true}
      - {entity: StoreSettings, read: true}
  - name: Sales Manager
    permissions:
      - {entity: ShoppingCart, read: true, export: true}
      - {entity: PaymentRequest, read: true, write: true, cancel: true, export: true}
      - {entity: OrderRefund, read: true, write: true, create: true, export: true}
      - {entity: ReturnReason, read: true}
      - {entity: WebsiteItem, read: true}
      - {entity: ItemCategory, read: true}
      - {entity: ShippingRule, read: true}
      - {entity: CouponCode, read: true}
      - {entity: StoreSettings, read: true}
  - name: Accounts Manager
    permissions:
      - {entity: PaymentRequest, read: true, write: true, cancel: true, export: true}
      - {entity: OrderRefund, read: true, write: true, export: true}
      - {entity: ReturnReason, read: true}
      - {entity: StoreSettings, read: true}
  - name: Accounts User
    permissions:
      - {entity: PaymentRequest, read: true, write: true}
      - {entity: OrderRefund, read: true}

messages:
  - key: commerce.order_shipped
    label: A shipment of a web order left
    entity: SalesOrder
    values: [lines, carrier, tracking_number, tracking_url, link]
    languages:
      en:
        email:
          subject: "Your order {{ doc.number }} has shipped"
          body: "<p>Your order {{ doc.number }} has left us{% if values.lines %}: {% for l in values.lines %}{{ l }}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}.</p>{% if values.carrier and values.tracking_number %}<p>{{ values.carrier }} has it, parcel {{ values.tracking_number }}.</p>{% elif values.carrier %}<p>{{ values.carrier }} has it.</p>{% elif values.tracking_number %}<p>Its parcel is {{ values.tracking_number }}.</p>{% endif %}{% if values.tracking_url %}<p>Where the carrier shows it: {{ values.tracking_url }}</p>{% endif %}{% if values.link %}<p><a href=\"{{ values.link }}\">Follow your order</a></p>{% endif %}"
  - key: commerce.gift_card_issued
    label: A gift card bought in the store
    entity: SalesOrder
    values: [code, pin, amount, store]
    languages:
      en:
        email:
          subject: "Your gift card from {{ values.store }}"
          body: "<p>Here is the gift card you bought with order {{ doc.number }}, holding {{ values.amount }}.</p><p>Its code: <strong>{{ values.code }}</strong>{% if values.pin %}, PIN <strong>{{ values.pin }}</strong>{% endif %}</p><p>Keep this message: we do not keep the code and cannot send it again.</p>"

seed:
  - entity: ReturnReason
    key: [reason]
    records:
      - {reason: Changed their mind}
      - {reason: Wrong item sent}
      - {reason: Damaged or defective, restock: false}
      - {reason: Not as described}
      - {reason: Arrived too late}
      - {reason: Cancelled before it shipped, restock: false}
      - {reason: Other}
