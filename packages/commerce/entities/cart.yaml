- name: ShoppingCartItem
  label: Shopping Cart Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, read_only: true, in_list: true}
    - {name: website_item, type: link, to: WebsiteItem, read_only: true, on_delete: set_null}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: price_list_rate, type: currency, currency: parent.currency, read_only: true}
    - {name: discount_percent, type: percent, read_only: true}
    - {name: rate, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: amount, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, currency: parent.currency, read_only: true}
    - {name: base_net_amount, type: currency, read_only: true}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: weight_kg, type: decimal, read_only: true}
    - {name: is_shipping, type: check, read_only: true, description: The shipping charge line}
    - {name: promotion_percent, type: data, hidden: true, read_only: true, label: Promotions' Share, description: "What promotions take off what this line's own discount left, as ERP works it out"}
    - {name: added_by_promotion, type: link, to: Promotion, read_only: true, on_delete: set_null, description: "A free item a promotion added"}

- name: ShoppingCart
  label: Shopping Cart
  kind: document
  module: commerce
  company_scoped: true
  title_field: email
  search_fields: [contact_name]
  fields:
    - {name: status, type: select, options: [Open, Abandoned, Ordered, Expired], default: Open, read_only: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, required: true, read_only: true, in_filter: true}
    - {name: customer, type: link, to: Customer, read_only: true, in_filter: true}
    - {name: ship_to, type: link, to: Address, read_only: true, hidden: true, on_delete: set_null, description: "Where the goods go, as an Address of the customer: set at checkout so the cart is priced exactly as its order will be (tax rules read the delivery region from it)"}
    - {name: user_email, type: email, read_only: true, label: Signed-in User}
    - {name: email, type: email, in_list: true}
    - {name: phone, type: phone}
    - {name: contact_name, type: data, max_length: 140, in_list: true}
    - {name: ship_address_line1, type: data, max_length: 200, label: Shipping Address Line 1}
    - {name: ship_address_line2, type: data, max_length: 200, label: Shipping Address Line 2}
    - {name: ship_city, type: data, max_length: 100, label: Shipping City}
    - {name: ship_state, type: data, max_length: 100, label: Shipping State}
    - {name: ship_postal_code, type: data, max_length: 20, label: Shipping Postal Code}
    - {name: ship_country, type: data, max_length: 2, label: Shipping Country, in_filter: true}
    - {name: delivery_country, type: data, max_length: 2, read_only: true, hidden: true, description: "Where the goods go, as country rules read it before any Address exists: the shipping country the shopper gave"}
    - {name: delivery_region, type: data, max_length: 100, read_only: true, hidden: true, description: "The shipping state or province the shopper gave"}
    - {name: billing_same_as_shipping, type: check, default: true}
    - {name: bill_address_line1, type: data, max_length: 200, label: Billing Address Line 1}
    - {name: bill_address_line2, type: data, max_length: 200, label: Billing Address Line 2}
    - {name: bill_city, type: data, max_length: 100, label: Billing City}
    - {name: bill_state, type: data, max_length: 100, label: Billing State}
    - {name: bill_postal_code, type: data, max_length: 20, label: Billing Postal Code}
    - {name: bill_country, type: data, max_length: 2, label: Billing Country}
    - {name: notes, type: text, max_length: 2000, label: Order Notes}
    - {name: reminder_consent, type: check, label: May Remind About This Cart, description: "The shopper agreed, at checkout, to be reminded of a cart they leave: an abandoned cart is told to them, and other apps' campaigns may act on it"}
    - {name: posting_date, type: date, read_only: true, label: Priced On}
    - {name: currency, type: link, to: Currency, read_only: true}
    - {name: conversion_rate, type: decimal, read_only: true}
    - {name: price_list, type: link, to: PriceList, read_only: true}
    - {name: tax_template, type: link, to: TaxTemplate, link_filters: {company: {from: company}}, read_only: true}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {company: {from: company}}, read_only: true, hidden: true, description: "The store's fulfilment warehouse, as its order names it (promotions may be for a place)"}
    - {name: channel, type: data, read_only: true, description: "Where the sale is made, as promotions name it: the store's Sales Channel"}
    - {name: promotion_codes, type: data, read_only: true, max_length: 1000, description: "Promotion codes the shopper gave, separated by commas"}
    - {name: applied_promotions, type: table, of: AppliedPromotion, read_only: true, label: Promotions Applied}
    - {name: items, type: table, of: ShoppingCartItem}
    - {name: taxes, type: table, of: TaxRow}
    - {name: coupon_code, type: data, read_only: true, max_length: 64, in_filter: true}
    - {name: coupon, type: link, to: CouponCode, read_only: true, on_delete: set_null}
    - {name: coupon_rule, type: link, to: PricingRule, read_only: true, on_delete: set_null, description: Pricing rule unlocked by the coupon}
    - {name: shipping_rule, type: link, to: ShippingRule, read_only: true, on_delete: set_null}
    - {name: shipping_amount, type: currency, currency: currency, read_only: true}
    - {name: total_weight_kg, type: decimal, read_only: true}
    - {name: item_count, type: decimal, read_only: true, in_list: true}
    - {name: total, type: currency, currency: currency, read_only: true}
    - {name: total_discount, type: currency, currency: currency, read_only: true}
    - {name: net_total, type: currency, currency: currency, read_only: true}
    - {name: total_taxes, type: currency, currency: currency, read_only: true}
    - {name: grand_total, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, currency: currency, read_only: true}
    - {name: rounded_total, type: currency, currency: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: last_activity, type: datetime, read_only: true, in_list: true}
    - {name: sales_order, type: link, to: SalesOrder, read_only: true, in_filter: true}
    - {name: payment_request, type: link, to: PaymentRequest, read_only: true}
    - {name: ordered_at, type: datetime, read_only: true}
    - {name: token_hash, type: data, read_only: true, hidden: true, unique: true, max_length: 64}
    - {name: checkout_key, type: data, read_only: true, hidden: true, max_length: 200}
  indexes: [[status, last_activity]]
  actions:
    # What a shopper does to a cart, as the storefront's routes do it and as an agent may (hidden: no button on the form).
    - {name: add_item, label: Add an Item, permission: write, hidden: true,
       params: [{name: item, label: Item, required: true, description: "A store item, by its slug or the WebsiteItem's id"},
                {name: qty, label: Quantity, description: "A decimal as text; 1 when empty. Added to what the cart holds of the item"}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The cart holds the item, priced again, committed with this receipt"}}
    - {name: set_quantity, label: Set a Line's Quantity, permission: write, hidden: true,
       params: [{name: line, label: Line, required: true, description: "The cart line's id"},
                {name: qty, label: Quantity, required: true, description: "A decimal as text; 0 takes the line off"}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The line has the quantity (or is gone), the cart priced again, committed with this receipt"}}
    - {name: set_details, label: Set Contact and Addresses, permission: write, hidden: true,
       # Not secret: a store takes a shopper's details with the vault closed (a secret parameter's receipt needs it), and
       # the cart's own history holds what it changed to anyway.
       params: [{name: details, label: Details, type: text, required: true,
                 description: "A JSON object: email, phone, name, notes, reminder_consent, billing_same_as_shipping, shipping_address and billing_address ({line1, line2, city, state, postal_code, country}). Keys left out stay as they are"}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The cart carries the details and is priced for where it goes, committed with this receipt"}}
    - {name: apply_code, label: Apply a Code, permission: write, hidden: true,
       params: [{name: code, label: Code, required: true, description: "The store's coupon or a promotion code"}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The code is on the cart and took something off, committed with this receipt"}}
    - {name: remove_code, label: Remove a Code, permission: write, hidden: true,
       params: [{name: code, label: Code, description: "The code to take off; empty: the store's coupon"}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The code is off the cart, priced again, committed with this receipt"}}
    - {name: set_shipping, label: Choose Delivery, permission: write, hidden: true,
       params: [{name: shipping_method, label: Delivery Method, type: link, to: ShippingRule, required: true}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The cart is delivered by the method, priced again, committed with this receipt"}}
    - {name: identify, label: Say Whose Cart It Is, permission: write, hidden: true,
       params: [{name: email, label: Shopper's Email, secret: true, description: "The email the shopper proved by signing in; empty: the cart is a guest's again"}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ShoppingCart}, status: {type: string}, item_count: {type: string}, rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "The cart names the shopper and the customer linked to that email, and is priced for them, committed with this receipt"}}
    - {name: checkout, label: Check Out, permission: write, hidden: true,
       params: [{name: payment_method, label: Payment Method, description: "One of the store's payment methods, by its gateway's name; empty only when a gift card pays all of it"},
                {name: accept_terms, label: Terms Accepted, type: check},
                {name: expected_total, label: Total the Buyer Saw, description: "A decimal as text: refused when the cart now comes to another total"},
                {name: return_url, label: Return Address, description: "Where the gateway sends the shopper back: an address under the store's own"},
                {name: details, label: Details, type: text, secret: true, description: "As set_details takes them, applied first"},
                {name: gift_card_code, label: Gift Card Code, secret: true},
                {name: gift_card_pin, label: Gift Card PIN, secret: true},
                {name: client_key, label: Caller's Key, required: true, description: "8 to 200 visible characters, kept on the cart: checking the cart out again with it answers the order made, with another is refused"}],
       contract: {effect: external_effect, unknown_outcome: manual,
                  returns: {type: object, properties: {
                    id: {type: string, format: uuid, x-ferrum-link: ShoppingCart},
                    sales_order: {type: string, format: uuid, x-ferrum-link: SalesOrder}, number: {type: string},
                    payment_request: {type: [string, "null"], format: uuid, x-ferrum-link: PaymentRequest},
                    rounded_total: {type: string}, currency: {type: string, description: "ISO code"}}},
                  completion: "A submitted web order for the cart, the customer it belongs to, and its payment request when something is left to pay, committed with this receipt; the confirmation mail and the gateway's collection follow the commit"}}
  form:
    - {label: Cart, fields: [status, company, customer, user_email, email, phone, contact_name, last_activity]}
    - {label: Items, fields: [items]}
    - {label: Shipping Address, collapsible: true, fields: [ship_address_line1, ship_address_line2, ship_city, ship_state, ship_postal_code, ship_country]}
    - {label: Billing Address, collapsible: true, fields: [billing_same_as_shipping, bill_address_line1, bill_address_line2, bill_city, bill_state, bill_postal_code, bill_country]}
    - {label: Pricing, fields: [posting_date, currency, conversion_rate, price_list, tax_template, taxes, coupon_code, coupon, coupon_rule, channel, promotion_codes, applied_promotions, shipping_rule, shipping_amount, total_weight_kg]}
    - {label: Totals, fields: [item_count, total, total_discount, net_total, total_taxes, grand_total, rounding_adjustment, rounded_total, base_grand_total]}
    - {label: Order, fields: [sales_order, payment_request, ordered_at, notes, reminder_consent]}
  list: {columns: [email, status, item_count, grand_total, last_activity], sort: last_activity desc}
