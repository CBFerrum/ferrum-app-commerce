- name: StoreWarehouse
  label: Store Warehouse
  kind: child
  fields:
    - {name: warehouse, type: link, to: Warehouse, required: true, link_filters: {is_group: false}, in_list: true}

- name: StoreCountry
  label: Store Country
  kind: child
  fields:
    - {name: country_code, type: data, required: true, max_length: 2, label: Country Code, in_list: true, description: "ISO 3166-1 alpha-2, e.g. IN or DE"}
    - {name: country_name, type: data, in_list: true}

- name: StorePaymentMethod
  label: Store Payment Method
  kind: child
  fields:
    - {name: gateway, type: data, required: true, max_length: 40, in_list: true, description: "A payment gateway plugin's name, or Manual or Cash on Delivery"}
    - {name: label, type: data, required: true, max_length: 100, in_list: true, description: Shown to customers at checkout}
    - {name: enabled, type: check, default: true, in_list: true}
    - {name: payment_account, type: link, to: Account, link_filters: {is_group: false}, description: "Bank or cash account the payments are booked to (empty: the company's default bank account)"}
    - {name: expiry_minutes, type: int, default: 60, min: 0, max: 525600, in_list: true, description: "Unpaid payment requests expire after this many minutes; 0 = never"}
    - {name: instructions, type: text, max_length: 2000, description: "Shown to the customer after checkout, e.g. bank transfer details"}

- name: StoreSettings
  label: Store Settings
  label_plural: Store Settings
  kind: settings
  module: commerce
  title_field: store_name
  fields:
    - {name: store_name, type: data, required: true, max_length: 140}
    - {name: company, type: link, to: Company, required: true}
    - {name: currency, type: link, to: Currency, required: true, description: "Currency of the storefront; prices come from the price list (read as company-currency prices) and are converted at the exchange rate"}
    - {name: price_list, type: link, to: PriceList, required: true, link_filters: {selling: true}}
    - {name: tax_template, type: link, to: TaxTemplate, description: "Sales taxes of web carts and orders (empty: the company's default sales template)"}
    - {name: display_prices_with_tax, type: check, description: Catalog prices include tax}
    - {name: warehouses, type: table, of: StoreWarehouse, description: "Warehouses whose stock can be sold online (empty: every warehouse of the company)"}
    - {name: fulfilment_warehouse, type: link, to: Warehouse, required: true, link_filters: {is_group: false}, description: Warehouse set on web order lines}
    - {name: enforce_stock, type: check, default: true, description: Refuse quantities beyond the available stock of stock items}
    - {name: show_stock_quantity, type: check, description: "Show available quantities to customers (otherwise only in stock / out of stock)"}
    - {name: allow_guest_checkout, type: check, default: true}
    - {name: default_customer_group, type: link, to: CustomerGroup, link_filters: {is_group: false}, description: Group of customers created by web checkouts}
    - {name: shipping_item, type: link, to: Item, description: "Non-stock service item that carries shipping charges on carts, orders and invoices"}
    - {name: allowed_countries, type: table, of: StoreCountry, description: "Countries the store ships to (empty: every country)"}
    - {name: payment_methods, type: table, of: StorePaymentMethod}
    - {name: terms_url, type: url, label: Terms Page, description: Customers must accept these terms at checkout}
    - {name: store_url, type: url, label: Storefront URL, description: Payment return addresses must start with it}
    - {name: max_qty_per_line, type: decimal, default: 100, min: "1", label: Maximum Quantity per Item}
    - {name: max_cart_lines, type: int, default: 50, min: 1, max: 500, label: Maximum Items per Cart}
    - {name: abandon_after_hours, type: int, default: 24, min: 1, max: 8760, label: Carts Count as Abandoned After (Hours)}
    - {name: cart_expiry_days, type: int, default: 30, min: 1, max: 3650, label: Carts Expire After (Days)}
    - {name: gift_card_kind, type: link, to: StoredValueKind, label: Gift Cards, description: "The stored value the shop takes at checkout and sells as gift cards (an item that names it); empty: no gift cards"}
    - {name: sales_channel, type: data, max_length: 140, default: Web Shop, label: Sales Channel, description: "The channel web carts and orders name, as promotions' Channels list it (empty: Web Shop)"}
    - {name: cancel_unpaid_orders, type: check, default: true, description: "Cancel a web order when its payment request expires unpaid, releasing its reserved stock"}
    - {name: cancel_window_hours, type: int, default: 24, min: 0, max: 8760, label: "Shoppers May Cancel for (Hours)", description: "After an order is placed, a shopper may cancel it themselves from the link in their confirmation, while it has not shipped: 0 = not at all"}
    - {name: cancel_refund, type: select, options: [Automatic, Desk Approves], default: Automatic, label: Refund of a Cancellation, description: "Automatic: what was paid goes back at once; Desk Approves: the refund waits for a person"}
    - {name: return_window_days, type: int, default: 14, min: 0, max: 365, label: "Shoppers May Ask to Return for (Days)", description: "After the goods were delivered a shopper may ask to send them back, from the same link: 0 = not at all. The desk approves or declines"}
    - {name: return_shipping_paid_by, type: select, options: [Shopper, Store], default: Shopper, label: Return Shipping Paid By}
    - {name: restocking_fee_percent, type: percent, default: 0, label: Restocking Fee, description: "Kept from what a return credits, per cent of the goods' price"}
    - {name: refund_destination, type: select, options: [Original Payment, Store Credit], default: Original Payment, label: Returns Are Refunded To}
    - {name: store_credit_kind, type: link, to: StoredValueKind, label: Store Credit, description: "The stored value a return is refunded as when the store refunds to store credit; empty: back to the payment"}
  form:
    - {label: Store, fields: [store_name, company, currency, price_list, tax_template, display_prices_with_tax, store_url, terms_url]}
    - {label: Stock, fields: [warehouses, fulfilment_warehouse, enforce_stock, show_stock_quantity]}
    - {label: Checkout, fields: [allow_guest_checkout, default_customer_group, allowed_countries, shipping_item, payment_methods, cancel_unpaid_orders, sales_channel, gift_card_kind]}
    - {label: After Sales, fields: [cancel_window_hours, cancel_refund, return_window_days, return_shipping_paid_by, restocking_fee_percent, refund_destination, store_credit_kind]}
    - {label: Limits, collapsible: true, fields: [max_qty_per_line, max_cart_lines, abandon_after_hours, cart_expiry_days]}
