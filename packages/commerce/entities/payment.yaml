- name: PaymentRequest
  label: Payment Request
  kind: document
  module: commerce
  submittable: true
  company_scoped: true
  title_field: order_number
  numbering: {template: "PAYREQ-{YYYY}-{seq:5}"}
  description: "A request to pay a web order (or an invoice). Gateway plugins subscribe to PaymentRequest.submitted, write payment_url with set_gateway_details and confirm with mark_paid or mark_failed."
  search_fields: [gateway_reference]
  fields:
    - {name: company, type: link, to: Company, required: true, read_only: true, in_filter: true}
    - {name: sales_order, type: link, to: SalesOrder, read_only: true, in_filter: true}
    - {name: sales_invoice, type: link, to: SalesInvoice, read_only: true, in_filter: true, description: "Without an order: the invoice it pays (a subscription's renewal)"}
    - {name: order_number, type: data, read_only: true, in_list: true}
    - {name: customer, type: link, to: Customer, read_only: true, in_filter: true}
    - {name: payer_name, type: data, read_only: true}
    - {name: payer_email, type: email, read_only: true}
    - {name: gateway, type: data, required: true, read_only: true, max_length: 40, in_list: true, in_filter: true}
    - {name: currency, type: link, to: Currency, required: true, read_only: true}
    - {name: currency_code, type: data, read_only: true, max_length: 3}
    - {name: amount, type: currency, currency: currency, required: true, read_only: true, in_list: true}
    - {name: status, type: select, options: [Initiated, Paid, Failed, Cancelled, Expired], default: Initiated, read_only: true, in_list: true, in_filter: true}
    - {name: expires_at, type: datetime, read_only: true}
    - {name: payment_url, type: url, read_only: true, max_length: 2000}
    - {name: gateway_reference, type: data, read_only: true, max_length: 200}
    - {name: return_url, type: url, read_only: true, max_length: 2000}
    - {name: description, type: data, read_only: true, max_length: 200}
    - {name: paid_at, type: datetime, read_only: true}
    - {name: payment_entry, type: link, to: PaymentEntry, read_only: true}
    - {name: refunded_amount, type: currency, currency: currency, read_only: true, no_copy: true, description: "Sent back to the shopper so far (refunds of this payment)"}
    - {name: failure_reason, type: text, read_only: true, max_length: 2000}
  indexes: [[status, expires_at]]
  rules:
    - {name: pays_something, check: "doc.sales_order != null || doc.sales_invoice != null", message: "A payment request pays an order or an invoice"}
  actions:
    - name: set_gateway_details
      label: Set Gateway Details
      docstatus: [1]
      permission: write
      params:
        - {name: payment_url, type: data, label: Payment Link, description: "Where the payer pays: an https:// address"}
        - {name: gateway_reference, type: data, label: Gateway Reference}
    - name: mark_paid
      label: Mark Paid
      docstatus: [1]
      permission: write
      confirm: "Record the payment of this request and book it?"
      params:
        - {name: amount, type: data, label: Amount Received, required: true, description: "The amount requested: another amount is refunded, not booked"}
        - {name: currency, type: link, to: Currency, label: Currency, required: true}
        - {name: gateway_reference, type: data, label: Gateway Reference, description: "The payment's reference at the gateway or bank"}
    - name: mark_failed
      label: Mark Failed
      docstatus: [1]
      permission: write
      params:
        - {name: reason, type: text, label: Reason}
        - {name: gateway_reference, type: data, label: Gateway Reference}
    - {name: report_exception, label: Report Exception, docstatus: [1, 2], permission: write, hidden: true}
  list: {columns: [number, order_number, gateway, amount, status], sort: created_at desc}

- name: PaymentException
  label: Payment Exception
  kind: master
  module: commerce
  title_field: gateway_reference
  description: "Money a gateway took that could not be booked: the request had closed, or the amount changed. It stays open until someone approves a refund, which the gateway carries out, or records how it was settled."
  search_fields: [gateway_reference]
  fields:
    - {name: gateway, type: data, required: true, read_only: true, max_length: 40, in_list: true, in_filter: true}
    - {name: gateway_reference, type: data, required: true, read_only: true, max_length: 200, in_list: true}
    - {name: payment_request, type: link, to: PaymentRequest, read_only: true, in_filter: true}
    - {name: amount, type: decimal, read_only: true, in_list: true}
    - {name: currency_code, type: data, read_only: true, max_length: 3, in_list: true}
    - {name: reason, type: text, required: true, read_only: true, max_length: 2000}
    - {name: status, type: select, options: [Open, Refund Approved, Refunded, Refund Failed, Resolved], default: Open, read_only: true, in_list: true, in_filter: true}
    - {name: approved_by, type: email, read_only: true, no_copy: true}
    - {name: approved_at, type: datetime, read_only: true, no_copy: true}
    - {name: refund_reference, type: data, read_only: true, max_length: 200, no_copy: true}
    - {name: refund_error, type: text, read_only: true, max_length: 2000, no_copy: true}
    - {name: note, type: text, read_only: true, max_length: 2000, no_copy: true}
  unique: [[gateway, gateway_reference]]
  actions:
    - {name: approve_refund, label: Approve Refund, permission: write, condition: "doc.status == 'Open' || doc.status == 'Refund Failed'", confirm: "Refund this payment at the gateway? This sends the money back."}
    - {name: resolve, label: Settled Another Way, permission: write, condition: "doc.status == 'Open' || doc.status == 'Refund Failed'", params: [{name: note, label: How it was settled, type: text, required: true}]}
    - {name: refund_done, label: Refund Done, permission: write, hidden: true}
    - {name: refund_failed, label: Refund Failed, permission: write, hidden: true}
  list: {columns: [gateway_reference, gateway, amount, currency_code, status], sort: created_at desc}
