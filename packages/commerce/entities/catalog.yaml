- name: ItemCategory
  label: Item Category
  label_plural: Item Categories
  kind: master
  module: commerce
  title_field: category_name
  search_fields: [slug]
  fields:
    - {name: category_name, type: data, required: true, max_length: 140, in_list: true}
    - {name: slug, type: data, unique: true, max_length: 140, in_list: true, description: "Name in the storefront address; made from the name when empty"}
    - {name: parent_category, type: link, to: ItemCategory, in_list: true, in_filter: true}
    - {name: published, type: check, default: true, in_list: true, in_filter: true}
    - {name: sort_order, type: int, default: 0}
    - {name: image, type: attach}
    - {name: description, type: markdown, max_length: 20000}
    - {name: seo_title, type: data, max_length: 200, label: SEO Title}
    - {name: seo_description, type: data, max_length: 500, label: SEO Description}
  list: {columns: [category_name, slug, parent_category, published], sort: category_name asc}

- name: WebsiteItemImage
  label: Website Item Image
  kind: child
  fields:
    - {name: image, type: attach, required: true, in_list: true}
    - {name: alt_text, type: data, max_length: 200, in_list: true}

- name: WebsiteItemCategory
  label: Website Item Category
  kind: child
  fields:
    - {name: category, type: link, to: ItemCategory, required: true, in_list: true, on_delete: cascade}

- name: WebsiteItemRelated
  label: Related Website Item
  kind: child
  fields:
    - {name: website_item, type: link, to: WebsiteItem, required: true, in_list: true, on_delete: cascade}

- name: WebsiteItemOption
  label: Website Item Option
  kind: child
  fields:
    - {name: option, type: data, required: true, max_length: 60, in_list: true, description: "What varies, e.g. Size or Colour"}
    - {name: value, type: data, required: true, max_length: 60, in_list: true, description: "This variant's choice, e.g. M or Red"}

- name: WebsiteItemDisabledOption
  label: Website Item Disabled Option
  kind: child
  fields:
    - {name: option, type: data, required: true, max_length: 60, in_list: true, description: "What varies, e.g. Size"}
    - {name: value, type: data, required: true, max_length: 60, in_list: true, description: "The value the store does not sell, e.g. XL: every combination that has it stays unpublished"}

- name: WebsiteItemAttribute
  label: Website Item Attribute
  kind: child
  fields:
    - {name: attribute, type: data, required: true, max_length: 60, in_list: true, description: "What is described, e.g. Material or Brand"}
    - {name: value, type: data, required: true, max_length: 60, in_list: true, description: "This item's value, e.g. Steel. Several rows may name the same attribute"}

- name: WebsiteItem
  label: Website Item
  kind: master
  module: commerce
  title_field: title
  search_fields: [slug, item_code]
  fields:
    - {name: item, type: link, to: Item, required: true, unique: true, in_list: true, in_filter: true}
    - {name: item_code, type: data, fetch_from: item.item_code, read_only: true}
    - {name: title, type: data, max_length: 200, in_list: true, description: "Name shown in the store (default: the item name)"}
    - {name: slug, type: data, unique: true, max_length: 140, in_list: true, description: "Name in the storefront address; made from the title when empty"}
    - {name: published, type: check, in_list: true, in_filter: true}
    - {name: ranking, type: int, default: 0, in_list: true, description: Higher ranks list first}
    - {name: variant_of, type: link, to: WebsiteItem, in_list: true, in_filter: true, on_delete: restrict, description: "Makes this item a variant (a size, a colour) of another store item: shoppers choose it on that item's page. A variant is an item of its own, with its own price, stock and code."}
    - {name: options, type: table, of: WebsiteItemOption, visible_if: "doc.variant_of != null", description: "What makes this variant different: Size M, Colour Red. Every variant of an item names the same options."}
    - {name: disabled_options, type: table, of: WebsiteItemDisabledOption, visible_if: "doc.variant_of == null", description: "Option values the store does not sell: the combinations that have one are kept unpublished"}
    - {name: short_description, type: text, max_length: 1000}
    - {name: long_description, type: markdown, max_length: 100000}
    - {name: images, type: table, of: WebsiteItemImage}
    - {name: categories, type: table, of: WebsiteItemCategory}
    - {name: related_items, type: table, of: WebsiteItemRelated}
    - {name: attributes, type: table, of: WebsiteItemAttribute, description: "What shoppers filter listings by. A variant's options (Size, Colour) count for its item without being repeated here"}
    - {name: weight_kg, type: decimal, min: "0", label: Shipping Weight per Unit (kg)}
    - {name: max_qty, type: decimal, min: "0", label: Maximum Quantity per Order, description: "0 or empty: the store limit"}
    - {name: backorder, type: check, label: Keep Selling When Out of Stock, in_filter: true, description: "Orders are taken beyond what is in stock and ship when it is back. Only matters while Store Settings refuse quantities beyond stock"}
    - {name: backorder_limit, type: decimal, min: "0", label: Most Owed at Once, visible_if: "doc.backorder", description: "How many may be ordered beyond stock, over all open orders together; 0 or empty: no limit"}
    - {name: ships_from, type: date, label: Ships From, description: "A date still to come is told to the shopper on the item, in the cart, on the order and in its confirmation. With Keep Selling When Out of Stock it makes a pre-order"}
    - {name: seo_title, type: data, max_length: 200, label: SEO Title}
    - {name: seo_description, type: data, max_length: 500, label: SEO Description}
    - {name: rating_average, type: decimal, read_only: true, precision: 2, no_copy: true}
    - {name: review_count, type: int, read_only: true, no_copy: true}
  form:
    - {label: Item, fields: [item, item_code, title, slug, published, ranking, variant_of, options, disabled_options]}
    - {label: Content, fields: [short_description, long_description, images]}
    - {label: Placement, fields: [categories, related_items]}
    - {label: Attributes, fields: [attributes]}
    - {label: Shipping and Limits, fields: [weight_kg, max_qty, backorder, backorder_limit, ships_from]}
    - {label: SEO, collapsible: true, fields: [seo_title, seo_description]}
    - {label: Reviews, collapsible: true, fields: [rating_average, review_count]}
  actions:
    - {name: generate_variants, label: Generate Variants, permission: write, condition: "doc.variant_of == null",
       confirm: "Make the combinations as ERP's item variants (the missing ones), each with a website item and the price of this one?",
       params: [{name: options, label: Options, type: text, required: true, description: "What it comes in, as JSON: {\"Size\": [\"S\", \"M\", \"L\"], \"Colour\": [\"Red\", \"Blue\"]}"},
                {name: disabled, label: "Values not sold", type: text, description: "Values the store does not sell, as JSON: {\"Size\": [\"L\"]}; their combinations are made unpublished"}],
       contract: {effect: transactional_action, returns: {type: object, properties: {variants_made_by_erp: {description: "What ERP answered making the variants"}, website_items_made: {type: integer}, unpublished: {type: integer}}},
                  completion: "The missing combinations made as ERP's item variants, each with its website item and this item's price, committed with this receipt"}}
    # A shopper's review and back-in-stock alert, as the storefront's routes ask for them and as an agent may.
    - {name: submit_review, label: Leave a Review, permission: write, hidden: true,
       params: [{name: rating, label: Rating, type: int, required: true, description: "1 to 5"},
                {name: title, label: Title}, {name: review, label: Review, type: text},
                {name: name, label: Reviewer's Name, required: true, secret: true},
                {name: email, label: Reviewer's Email, required: true, secret: true},
                {name: customer, label: Customer, type: link, to: Customer, description: "Only for a reviewer who proved the email (signed in): the customer linked to it"}],
       contract: {effect: transactional_action, returns: {type: object, properties: {review: {type: string, format: uuid, x-ferrum-link: ItemReview}, status: {type: string}}},
                  completion: "A Pending review of the item exists, committed with this receipt; it shows once a manager approves it"}}
    - {name: stock_alert, label: Tell Me When It Is Back, permission: read, hidden: true,
       params: [{name: email, label: Email, required: true, secret: true}],
       contract: {effect: transactional_action, retention_days: 30, returns: {type: object, properties: {status: {type: string}, alert: {type: [string, "null"], format: uuid, x-ferrum-link: StockAlert}}},
                  completion: "The address waits to be told once when the item is back (or already did), committed with this receipt; the mail is sent by the store's upkeep"}}
  list: {columns: [title, item, slug, published, ranking], sort: title asc}

- name: ItemReview
  label: Item Review
  kind: master
  module: commerce
  title_field: title
  fields:
    - {name: website_item, type: link, to: WebsiteItem, required: true, in_list: true, in_filter: true, on_delete: cascade}
    - {name: rating, type: int, required: true, min: 1, max: 5, in_list: true}
    - {name: title, type: data, max_length: 200, in_list: true}
    - {name: review, type: text, max_length: 5000}
    - {name: reviewer_name, type: data, required: true, max_length: 100, in_list: true}
    - {name: reviewer_email, type: email}
    - {name: customer, type: link, to: Customer, in_filter: true}
    - {name: status, type: select, options: [Pending, Approved, Rejected], default: Pending, in_list: true, in_filter: true}
    - {name: verified_purchase, type: check, read_only: true, in_list: true, in_filter: true, description: The reviewer's email bought this item}
    - {name: published_on, type: date, read_only: true}
  rules:
    - {name: reviewer_known, check: "doc.reviewer_email != null || doc.customer != null", message: "A review needs the reviewer's email or customer"}
  list: {columns: [website_item, rating, title, reviewer_name, status, verified_purchase], sort: created_at desc}

- name: StockAlert
  label: Stock Alert
  kind: document
  module: commerce
  title_field: item_title
  search_fields: [email, item_title]
  description: "A shopper asked to be told when an out of stock item is back: told once, when it is."
  fields:
    - {name: website_item, type: link, to: WebsiteItem, required: true, read_only: true, on_delete: cascade, in_filter: true}
    - {name: item_title, type: data, read_only: true, max_length: 200, in_list: true}
    - {name: item_slug, type: data, read_only: true, max_length: 200}
    - {name: email, type: email, required: true, read_only: true, in_list: true}
    - {name: status, type: select, options: [Waiting, Sent], default: Waiting, read_only: true, in_list: true, in_filter: true}
    - {name: sent_at, type: datetime, read_only: true}
  indexes: [[status, website_item]]
  list: {columns: [item_title, email, status, created_at], sort: created_at desc}
