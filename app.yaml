id: commerce
name: Commerce
version: 0.10.4
publisher: cbferrum
summary: "Online store: catalog with variants, carts, coupons, shipping, guest and portal checkout, a web-order desk, refunds and returns, order tracking, payment requests for gateway plugins"
description: README.md
categories: [commerce, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-commerce
support: https://github.com/CBFerrum/ferrum-app-commerce/issues
runtime: native
platform: ">=0.3.6, <0.4"
# Records of ERP (items, customers, accounts, stock): installing it installs ERP.
requires: {erp: ">=0.24"}
packages: [commerce]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: commerce
      route: commerce
      title: Store
      description: Your online store's sales, orders to ship, refunds, payments, reviews and catalog
      icon: shopping-cart
      color: "#be185d"
      roles: [Website Manager, Sales Manager]
  shell.open:
    # The store's own records (orders are ERP's and open there).
    - {id: commerce, package: commerce, path: "commerce/e/{entity}/{id}", list: "commerce/e/{entity}"}
  shell.create:
    - {id: website_item, label: Store item, path: commerce/e/WebsiteItem/new, entity: WebsiteItem}
    - {id: coupon, label: Coupon, path: commerce/e/CouponCode/new, entity: CouponCode}
  # What the assistant should know in Commerce's pages, and what it suggests asking there.
  shell.assistant:
    - id: store
      title: "Commerce"
      instructions: >-
        A web order is an ERP Sales Order placed from a ShoppingCart (Open, Abandoned, Ordered, Expired), in the
        store's currency. Its payment is a PaymentRequest (Initiated, Paid, Failed, Cancelled, Expired); a payment the
        gateway took but could not book is a PaymentException to resolve. Refunds are OrderRefund: Requested,
        Approved, Refunded, Refund Failed or Declined. A WebsiteItem is what the store shows of an ERP item; an
        ItemReview waits as Pending until it is approved.
      suggestions:
        - "How many web orders did we take this week?"
        - "Which carts were abandoned today?"
        - "Are there payments that need attention?"
        - "Which refunds are still waiting?"
