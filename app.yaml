id: commerce
name: Commerce
version: 0.3.2
publisher: cbferrum
summary: "Online store: catalog, carts, coupons, shipping, guest and portal checkout, web orders and payment requests for gateway plugins"
description: README.md
categories: [commerce, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-commerce
support: https://github.com/CBFerrum/ferrum-app-commerce/issues
runtime: native
platform: ">=0.3.1, <0.4"
# Records of ERP (items, customers, accounts, stock): installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [commerce]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: commerce
      route: commerce
      title: Store
      description: Your online store's sales, orders to deliver, payments, reviews and catalog
      icon: shopping-cart
      color: "#be185d"
      roles: [Website Manager, Sales Manager]
  shell.open:
    # The store's own records (orders are ERP's and open there).
    - {id: commerce, package: commerce, path: "commerce/e/{entity}/{id}", list: "commerce/e/{entity}"}
  shell.create:
    - {id: website_item, label: Store item, path: commerce/e/WebsiteItem/new, entity: WebsiteItem}
    - {id: coupon, label: Coupon, path: commerce/e/CouponCode/new, entity: CouponCode}
