[package]
name = "gateway-kit"
description = "What Ferrum Commerce's payment gateway plugins share: amounts in minor units, webhook signatures, times"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrum-plugin-sdk = { workspace = true }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

# Native builds only (the gateways' tests against providers' sandboxes); never in the plugins.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
